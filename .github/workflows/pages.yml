name: Deploy Blockbound to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare Blockbound
        run: |
          mkdir -p _site
          cp -R "Game using VS Code AI/Assets" _site/Assets
          cp "Game using VS Code AI/Assets/index/Index.html" _site/index.html
          sed -i 's|../Style.css|Assets/Style.css|g' _site/index.html
          sed -i 's|../Screenshot|Assets/Screenshot|g' _site/index.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
